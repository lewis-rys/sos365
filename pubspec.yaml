name: sos365
description: Aplicación de emergencia con botón de pánico y llamada rápida
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  google_fonts: ^6.0.0
  flutter_svg: ^2.1.1

  url_launcher: ^6.3.0

  mongo_dart: ^0.10.0
  http: ^1.2.0
  mailer: ^6.0.1

  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  permission_handler: ^11.3.1

  camera: ^0.11.0+2
  flutter_sound: ^9.2.13
  video_player: ^2.9.2
  audioplayers: ^6.6.0
  vibration: ^2.0.1

  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  geolocator: ^12.0.0
  pdfx: ^2.9.2
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/icon/
    - lib/assets/pdf/

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/sos365red.png"
  remove_alpha_ios: true