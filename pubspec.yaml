name: sos365
description: Aplicación de emergencia con botón de pánico y llamada rápida
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  vibration: ^2.0.1
  url_launcher: ^6.2.6
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/icon/

flutter_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/sos365red.png"